services:
  postgres:
    image: postgres:16-alpine
    container_name: tervox-postgres
    environment:
      POSTGRES_DB: tervox_dev
      POSTGRES_USER: tervox
      POSTGRES_PASSWORD: tervox_dev
    ports:
      - "5432:5432"
    volumes:
      - tervox_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tervox -d tervox_dev"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  tervox_pg:
